spring:
  application:
    name: ATMS-Online

  datasource:
    url: jdbc:postgresql://localhost:5432/sms_db
    username: postgres
    password: your_postgres_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

application:
  security:
    jwt:
      # 256-bit Base64-encoded HMAC secret key
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      # 86400000 ms = 24 hours
      expiration: 86400000